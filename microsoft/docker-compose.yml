version: '3.8'

services:
  # PostgreSQL with pgvector for RAG and structured data
  postgres:
    image: pgvector/pgvector:pg16
    container_name: venturescope-db
    environment:
      POSTGRES_DB: venturescope
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
